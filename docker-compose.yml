# Desarrollo local: api + PostgreSQL 16.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kenko
      POSTGRES_PASSWORD: kenko
      POSTGRES_DB: kenko_documents
    ports:
      - "5432:5432"
    volumes:
      - documents-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenko -d kenko_documents"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      DATABASE_URL: postgresql+psycopg://kenko:kenko@db:5432/kenko_documents
      AWS_REGION: us-east-1
      EVENT_BUS_NAME: kenko-dev-bus
    depends_on:
      db:
        condition: service_healthy
    # Migra y arranca (o usa: docker compose run api alembic upgrade head).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  documents-db-data:
